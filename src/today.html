<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — BitsAndBytesMenuPlanner</title>
  <link rel="icon" href="img/Icon_32x32.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <div class="role-banner" style="display:none;" data-guest-banner>
      Guest view — sign in to favorite or mark meals cooked
    </div>
    <header class="app-header">
      <img class="logo" src="img/Icon_128x128.png" alt="">
      <div>
        <h1>Today</h1>
        <p class="subtitle">Saturday, 3 October</p>
      </div>
      <div class="header-spacer"></div>
      <button class="icon-btn" aria-label="Search" onclick="document.getElementById('search-row').classList.toggle('open')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </header>

    <main class="app-content">
      <div class="search-box" id="search-row" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search meals or ingredients…">
      </div>

      <div class="card" style="margin-bottom:1.1rem;">
        <div class="slot-label">Breakfast</div>
        <a href="meal-detail.html" class="meal-card" style="margin-top:0.5rem;">
          <img src="img/Icon_256x256.png" alt="">
          <div class="meal-info">
            <div class="meal-title">Chocolate Pap</div>
            <span class="badge badge-cooked">Not cooked</span>
          </div>
          <button class="fav-btn member-only" aria-label="Favorite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7-4.35-9.5-8.8C.8 8.4 2.4 5 5.8 5c1.9 0 3.3 1 4.2 2.4C11 6 12.4 5 14.3 5c3.4 0 5 3.4 3.3 6.7C19 16.15 12 20.5 12 20.5z"/></svg>
          </button>
        </a>
      </div>

      <div class="card" style="margin-bottom:1.1rem;">
        <div class="slot-label">Lunch</div>
        <a href="meal-detail.html" class="meal-card" style="margin-top:0.5rem;">
          <img src="img/Icon_256x256.png" alt="">
          <div class="meal-info">
            <div class="meal-title">Beef Burgers, Pineapple &amp; Chips</div>
            <span class="badge badge-not-cooked">Not cooked</span>
          </div>
          <button class="fav-btn active member-only" aria-label="Favorite">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7-4.35-9.5-8.8C.8 8.4 2.4 5 5.8 5c1.9 0 3.3 1 4.2 2.4C11 6 12.4 5 14.3 5c3.4 0 5 3.4 3.3 6.7C19 16.15 12 20.5 12 20.5z"/></svg>
          </button>
        </a>
      </div>

      <div class="card">
        <div class="slot-label">Dinner</div>
        <a href="meal-detail.html" class="meal-card" style="margin-top:0.5rem;">
          <img src="img/Icon_256x256.png" alt="">
          <div class="meal-info">
            <div class="meal-title">T-Bone Steak, Potato Salad &amp; Garlic Bread</div>
            <span class="badge badge-cooked" data-cooked-toggle="cooked" onclick="event.preventDefault()">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              <span class="label">Cooked</span>
            </span>
          </div>
          <button class="fav-btn member-only" aria-label="Favorite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7-4.35-9.5-8.8C.8 8.4 2.4 5 5.8 5c1.9 0 3.3 1 4.2 2.4C11 6 12.4 5 14.3 5c3.4 0 5 3.4 3.3 6.7C19 16.15 12 20.5 12 20.5z"/></svg>
          </button>
        </a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="today.html" class="active">

      <a href="settings.php">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1L14.9 3h-4l-.4 2.5a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L6.4 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.4 2.5h4l.4-2.5a8 8 0 0 0 1.7-1l2.4 1 2-3.4z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
  <script src="js/mockup.js"></script>
  <script>
    if ((localStorage.getItem("bnb-mock-role") || "parent") === "guest") {
      document.querySelector("[data-guest-banner]").style.display = "block";
    }
  </script>
</body>
</html>
