<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — BitsAndBytesMenuPlanner</title>
  <link rel="icon" href="img/Icon_32x32.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-screen">
  <div class="app-shell">
    <main class="app-content">
      <div class="brand-block">
        <img src="img/Icon_128x128.png" alt="">
        <h1>BitsAndBytesMenuPlanner</h1>
        <p class="subtitle">This month's menu, ready when you are.</p>
      </div>

      <form onsubmit="return false;">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="mom@family.com" value="mom@family.com">
        </div>
        <div class="field">
          <label for="pin">PIN</label>
          <input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" value="1234">
          <p class="hint">4–6 digit PIN, set in Settings.</p>
        </div>
        <a href="today.html" class="btn btn-primary" data-login="parent">Log In</a>
      </form>

      <div class="divider">or</div>

      <a href="today.html" class="btn btn-secondary" data-login="guest">Continue as Guest</a>
      <p class="hint" style="text-align:center; margin-top:0.75rem;">
        Guests can view the menu and recipes, but can't favorite, mark meals
        cooked, or make changes.
      </p>
    </main>
  </div>
  <script src="js/mockup.js"></script>
</body>
</html>
