# Builds the app's Docker image, proves the *standalone* image actually
# works (no bind mount, no compose file -- exactly how a GHCR pull runs it),
# and publishes it.
#
# The standalone run matters because the image bakes the app in via COPY
# (see php-server.dockerfile) specifically so it's runnable on its own; local
# dev's docker-compose.yml bind-mounts over that same path, which would hide
# a broken COPY/.dockerignore and let a bad image through untested.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Work out the image name
        # Docker repository names must be lowercase and GitHub account names
        # need not be -- done here rather than hardcoded so a fork publishes
        # under its own owner without editing the workflow.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bitsandbytesmenuplanner" >> "$GITHUB_ENV"

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-server.dockerfile
          load: true
          tags: bnb-planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it standalone (no bind mount, no compose)
        run: docker run -d --name bnb-ci -p 8080:8000 bnb-planner:ci

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login.php || true)
            [ "$code" = 200 ] && echo "ready after ${i}s" && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' bnb-ci)" = false ] && break
            sleep 1
          done
          echo "::error::the container never served login.php (last status ${code:-none})"
          docker logs bnb-ci
          exit 1

      - name: Fresh deploy gets a working demo login
        # Proves lib/db.php's first-run bootstrap (demo user, budget, a menu
        # cycle covering today) actually runs against a container that has
        # never seen this codebase before -- not just against a dev checkout
        # that already has a database sitting in a bind-mounted volume.
        run: |
          fail() { echo "::error::$1"; docker logs bnb-ci; exit 1; }

          body=$(curl -s -c /tmp/cj.txt -X POST http://localhost:8080/login.php \
                   --data-urlencode "action=login" \
                   --data-urlencode "email=demo@example.com" \
                   --data-urlencode "pin=1234")
          echo "$body" | grep -q 'location.replace("today.php")' \
            || fail "demo account could not log in on a fresh container"

          code=$(curl -s -b /tmp/cj.txt -o /dev/null -w '%{http_code}' http://localhost:8080/today.php)
          [ "$code" = 200 ] || fail "today.php answered $code after logging in as the demo user"

      - name: Data and source files stay off-limits
        # Regression test for a real vulnerability found in Phase 14: PHP's
        # built-in server otherwise serves the whole document root, including
        # the live SQLite database, as static files.
        run: |
          fail() { echo "::error::$1"; docker logs bnb-ci; exit 1; }
          for path in /data/family.sqlite /lib/schema.sql /lib/auth.php /scripts/seed.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            [ "$code" = 404 ] || fail "$path answered $code, expected 404"
          done

      - name: Tear down
        if: always()
        run: docker rm -f bnb-ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php-server.dockerfile
          push: true
          # Two tags on purpose: `latest` is what a host pulls, `sha-…` is
          # what you name when something is wrong with `latest` and you need
          # to say which build you mean.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
